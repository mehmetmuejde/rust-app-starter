[package]
name = "starter-platform"
description = "Host services per platform: native thread job runner, data directories and logging; browser logging and storage persistence."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
starter-application = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Navigator", "StorageManager", "console"] }

[dev-dependencies]
starter-domain = { workspace = true }

[lints]
workspace = true
