# Static hosting for the trunk bundle (see Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Compress the wasm module and the JS glue on the fly.
    gzip on;
    gzip_types application/wasm application/javascript text/css;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # index.html must always be revalidated, otherwise a new deployment loads stale hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # trunk puts a content hash into every asset name, so assets can be cached forever.
    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
